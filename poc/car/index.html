<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>POC Car</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud,
      #hud-drive {
        position: fixed;
        padding: 8px 14px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        font-size: 20px;
        font-weight: 600;
        user-select: none;
        pointer-events: none;
      }
      #hud {
        top: 12px;
        left: 12px;
      }
      #hud-drive {
        right: 12px;
        bottom: 12px;
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
        column-gap: 14px;
        align-items: center;
        min-width: 220px;
        font-variant-numeric: tabular-nums;
      }
      #hud-gear {
        grid-row: 1 / 3;
        font-size: 48px;
        line-height: 1;
        min-width: 1.2em;
        text-align: center;
      }
      #hud-rpm-bar {
        position: relative;
        height: 10px;
        border-radius: 5px;
        background: #333;
        overflow: hidden;
      }
      #hud-rpm-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: #ffaa00;
      }
      #hud-rpm-fill.redline {
        background: #ff3b3b;
      }
      #hud-rpm-text {
        font-size: 14px;
        opacity: 0.8;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">Score: <span id="hud-score">0</span></div>
    <div id="hud-drive">
      <div id="hud-gear">N</div>
      <div id="hud-rpm-bar"><div id="hud-rpm-fill"></div></div>
      <div id="hud-rpm-text"><span id="hud-rpm">0</span> rpm · <span id="hud-speed">0</span> km/h</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
