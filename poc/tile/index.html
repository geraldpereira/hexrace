<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>POC tuiles</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #1c1917;
                color: #e7e5e4;
                font: 14px/1.4 system-ui, sans-serif;
            }
            #app {
                display: flex;
                flex-direction: column;
                height: 100%;
            }
            #bar {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 24px;
                align-items: center;
                padding: 8px 16px;
            }
            #bar label {
                white-space: nowrap;
            }
            #status {
                flex-basis: 100%;
                margin: 0;
            }
            #stage {
                position: relative;
                flex: 1;
                min-height: 0;
            }
            #gl {
                display: block;
                width: 100%;
                height: 100%;
            }
            #map {
                position: absolute;
                right: 16px;
                bottom: 16px;
                width: 360px;
                height: 240px;
                background: rgba(12, 10, 9, 0.7);
                border: 1px solid #44403c;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
