<main>
  <header>
    <a routerLink="/lab">← lab</a>
    <h1>car</h1>
    <p>{{ status() }}</p>
  </header>
  <div class="frame">
    <hr-canvas-frame [canvas]="canvas" (resized)="onResized($event)" />
    <hr-car-gauges class="overlay dashboard" [dash]="dash" [spec]="spec" />
    <div class="overlay lamps">
      <hr-assist-lamps [assists]="dash.assists()" />
    </div>
  </div>
</main>
@if (showPaddles()) {
  <hr-touch-paddles [source]="touch" />
}
