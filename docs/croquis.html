<h1>HexRace - Croquis et schémas</h1>

Color" stroke-width="1.5" opacity="0.18" stroke-dasharray="4 3"/><polygon points="165.0,265.6 130.0,326.2 60.0,326.2 25.0,265.6 60.0,205.0 130.0,205.0" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.18" stroke-dasharray="4 3"/><polygon points="165.0,144.4 130.0,205.0 60.0,205.0 25.0,144.4 60.0,83.8 130.0,83.8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.18" stroke-dasharray="4 3"/><text x="200" y="210" text-anchor="middle" font-size="12" opacity="0.7">tuile</text></svg><figcaption>Fig. 1. Côté plat vers l'avant. Les six faces portent les heures d'une horloge : 12 devant, 6 derrière. Les voisines (en pointillé) se trouvent au bout de chaque face.</figcaption></figure><figure><svg viewBox="0 0 600 175" role="img" aria-label="Cinq hexagones montrant la piste entrant par la face 6 et sortant par 12, 2, 4, 10 ou 8"><polygon points="104.0,70.0 82.0,108.1 38.0,108.1 16.0,70.0 38.0,31.9 82.0,31.9" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M60.0,108.1 Q60.0,70.0 60.0,31.9" fill="none" stroke="#d97706" stroke-width="14" stroke-linecap="butt" opacity="1"/><text x="60" y="136" text-anchor="middle" font-size="12" font-weight="600">sortie 12</text><text x="60" y="152" text-anchor="middle" font-size="11" opacity="0.75">droite</text><text x="60" y="102.10511776651529" text-anchor="middle" font-size="10" opacity="0.75" fill="#fff" stroke="none">6</text><polygon points="224.0,70.0 202.0,108.1 158.0,108.1 136.0,70.0 158.0,31.9 202.0,31.9" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M180.0,108.1 Q180.0,70.0 213.0,50.9" fill="none" stroke="#d97706" stroke-width="14" stroke-linecap="butt" opacity="1"/><text x="180" y="136" text-anchor="middle" font-size="12" font-weight="600">sortie 2</text><text x="180" y="152" text-anchor="middle" font-size="11" opacity="0.75">60° à droite</text><polygon points="344.0,70.0 322.0,108.1 278.0,108.1 256.0,70.0 278.0,31.9 322.0,31.9" fill="none" stroke="currentColor" stroke-widt e="currentColor" stroke-width="1"/><line x1="84" y1="114" x2="84" y2="122" stroke="currentColor" stroke-width="1"/><text x="58.0" y="133" text-anchor="middle" font-size="11">paysage</text><line x1="88" y1="118" x2="140" y2="118" stroke="currentColor" stroke-width="1"/><line x1="88" y1="114" x2="88" y2="122" stroke="currentColor" stroke-width="1"/><line x1="140" y1="114" x2="140" y2="122" stroke="currentColor" stroke-width="1"/><text x="114.0" y="133" text-anchor="middle" font-size="11">bas-côté</text><line x1="144" y1="118" x2="308" y2="118" stroke="currentColor" stroke-width="1"/><line x1="144" y1="114" x2="144" y2="122" stroke="currentColor" stroke-width="1"/><line x1="308" y1="114" x2="308" y2="122" stroke="currentColor" stroke-width="1"/><text x="226.0" y="133" text-anchor="middle" font-size="11">piste : 3</text><line x1="312" y1="118" x2="364" y2="118" stroke="currentColor" stroke-width="1"/><line x1="312" y1="114" x2="312" y2="122" stroke="currentColor" stroke-width="1"/><line x1="364" y1="114" x2="364" y2="122" stroke="currentColor" stroke-width="1"/><text x="338.0" y="133" text-anchor="middle" font-size="11">bas-côté</text><line x1="368" y1="118" x2="476" y2="118" stroke="currentColor" stroke-width="1"/><line x1="368" y1="114" x2="368" y2="122" stroke="currentColor" stroke-width="1"/><line x1="476" y1="114" x2="476" y2="122" stroke="currentColor" stroke-width="1"/><text x="422.0" y="133" text-anchor="middle" font-size="11">paysage</text><line x1="32" y1="22" x2="476" y2="22" stroke="currentColor" stroke-width="1"/><line x1="32" y1="18" x2="32" y2="26" stroke="currentColor" stroke-width="1"/><line x1="476" y1="18" x2="476" y2="26" stroke="currentColor" stroke-width="1"/><text x="254.0" y="37" text-anchor="middle" font-size="11">une face : 8 unités</text><text x="30" y="166" font-size="11" opacity="0.8">position = 2 (première unité du bloc depuis la gauche) · largeur piste = 3</text><text x="30" y="182" font-size="11" opacity="0.8">bas-côtés 1 + 1 · piste + bas-côtés = 5 ≤ 6 · paysage 1 à gauche, 2 à droite</text></svg><figcaption>Fig. 3. Le profil d'une face, en unités (une unité = une largeur de voiture). Le bloc piste plus bas-côtés fait au plus 6 unités, ce qui laisse au moins une unité de paysage de chaque côté. La position se compte depuis la gauche.</figcaption></figure><figure><svg viewBox="0 0 600 280" role="img" aria-label="À gauche, une tuile dont la piste se resserre et se décale dans sa bande centrale ; à droite, une coupe où la hauteur passe de 4 à 6 par une pente au milieu"><rect x="40" y="30" width="176" height="200" fill="currentColor" opacity="0.10" stroke="none"/><rect x="40" y="30" width="176" height="200" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="62" y="154.0" width="22" height="76.0" fill="currentColor" opacity="0.28" stroke="none"/><rect x="172" y="154.0" width="22" height="76.0" fill="currentColor" opacity="0.28" stroke="none"/><rect x="84" y="154.0" width="88" height="76.0" fill="#d97706" opacity="1" stroke="none"/><rect x="128" y="30" width="22" height="76.0" fill="currentColor" opacity="0.28" stroke="none"/><rect x="194" y="30" width="22" height="76.0" fill="currentColor" opacity="0.28" stroke="none"/><rect x="150" y="30" width="44" height="76.0" fill="#d97706" opacity="1" stroke="none"/><polygon points="84,154.0 172,154.0 194,106.0 150,106.0" fill="#d97706" opacity="1"/><polygon points="62,154.0 84,154.0 150,106.0 128,106.0" fill="currentColor" opacity="0.28"/><polygon points="172,154.0 194,154.0 216,106.0 194,106.0" fill="currentColor" opacity="0.28"/><line x1="34" y1="106.0" x2="222" y2="106.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><line x1="34" y1="154.0" x2="222" y2="154.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><text x="228" y="134.0" font-size="11">changement<tspan x="228" dy="14">au milieu</tspan></text><text x="128.0" y="20" text-anchor="middle" font-size="11">sortie : pos 4 · piste 2</text><text x="128.0" y="248" te
